name: Deploy Storybook and web app to GitHub Pages

on:
  push:
    branches:
      - feature/glass-sidebar
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build Storybook
        run: npm run build-storybook

      # Web uygulaması alt yolda servis edildiği için Vite `base`'i ve router
      # basepath'i `${{ steps.pages.outputs.base_path }}/web` ile hizalanır.
      - name: Build web app (statik)
        env:
          WEB_STATIC: '1'
          WEB_BASE_PATH: ${{ steps.pages.outputs.base_path }}/web/
        run: npm run build:web

      - name: Assemble Pages site
        run: |
          cp -R apps/web/.output/public storybook-static/web
          # GitHub Pages bilinmeyen yollarda yalnızca kök 404.html'i servis eder;
          # web'in SPA kabuğu buraya konarak routing'i client devralır.
          cp apps/web/.output/public/404.html storybook-static/404.html
          # Alt çizgiyle başlayan dosyaların Jekyll tarafından elenmesini engeller.
          touch storybook-static/.nojekyll

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: storybook-static

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
